name: CI

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Check for Xcode project
      id: check_project
      run: |
        if [ -d "LivesportClaude/LivesportClaude.xcodeproj" ]; then
          echo "has_xcodeproj=true" >> $GITHUB_OUTPUT
          echo "✅ Found Xcode project"
        else
          echo "has_xcodeproj=false" >> $GITHUB_OUTPUT
          echo "⚠️  Xcode project not found, will use Swift Package Manager"
        fi

    - name: Build and test (Xcode Project)
      if: steps.check_project.outputs.has_xcodeproj == 'true'
      run: |
        cd LivesportClaude
        xcodebuild clean -project LivesportClaude.xcodeproj -scheme LivesportClaude || true
        xcodebuild test \
          -project LivesportClaude.xcodeproj \
          -scheme LivesportClaude \
          -destination 'platform=macOS' \
          -enableCodeCoverage YES \
          -resultBundlePath TestResults \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Build and test (Swift Package)
      if: steps.check_project.outputs.has_xcodeproj == 'false'
      run: |
        swift build
        swift test --enable-code-coverage

    - name: Generate coverage report (Xcode)
      if: steps.check_project.outputs.has_xcodeproj == 'true'
      run: |
        cd LivesportClaude
        xcrun xccov view --report --json TestResults.xcresult > coverage.json
        xcrun xccov view --report TestResults.xcresult > coverage.txt

    - name: Generate coverage report (Swift Package)
      if: steps.check_project.outputs.has_xcodeproj == 'false'
      run: |
        mkdir -p LivesportClaude
        xcrun llvm-cov export -format="lcov" \
          .build/debug/LivesportClaudePackageTests.xctest/Contents/MacOS/LivesportClaudePackageTests \
          -instr-profile .build/debug/codecov/default.profdata > LivesportClaude/coverage.lcov
        echo "Coverage report generated (LCOV format)" > LivesportClaude/coverage.txt
        echo "Note: Swift Package Manager was used for testing" >> LivesportClaude/coverage.txt

    - name: Display coverage summary
      if: always()
      run: |
        cd LivesportClaude
        if [ -f "coverage.txt" ]; then
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Coverage report not available" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Parse coverage percentage
      id: coverage
      run: |
        if [ -f "LivesportClaude/coverage.txt" ]; then
          cd LivesportClaude
          COVERAGE=$(xcrun xccov view --report TestResults.xcresult | grep -E "^\s*LivesportClaude" | awk '{print $2}' | sed 's/%//' || echo "0")
        else
          COVERAGE="0"
          echo "⚠️  Coverage calculation skipped (Xcode project required for accurate coverage)"
        fi
        echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
        echo "Coverage: $COVERAGE%"

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          LivesportClaude/coverage.json
          LivesportClaude/coverage.txt
          LivesportClaude/coverage.lcov
          LivesportClaude/TestResults.xcresult

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          let coverage = '⚠️ Coverage report not available';

          try {
            if (fs.existsSync('LivesportClaude/coverage.txt')) {
              coverage = fs.readFileSync('LivesportClaude/coverage.txt', 'utf8');
            }
          } catch (error) {
            console.log('Could not read coverage file:', error.message);
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 📊 Test Coverage Report\n\n\`\`\`\n${coverage}\n\`\`\``
          });

    - name: Check coverage threshold
      if: steps.check_project.outputs.has_xcodeproj == 'true'
      run: |
        cd LivesportClaude
        COVERAGE=$(xcrun xccov view --report TestResults.xcresult | grep -E "^\s*LivesportClaude" | awk '{print $2}' | sed 's/%//')
        echo "Current coverage: $COVERAGE%"

        THRESHOLD=70
        if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "❌ Coverage $COVERAGE% is below threshold $THRESHOLD%"
          exit 1
        else
          echo "✅ Coverage $COVERAGE% meets threshold $THRESHOLD%"
        fi

  build:
    name: Build App
    runs-on: macos-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Check for Xcode project
      id: check_project
      run: |
        if [ -d "LivesportClaude/LivesportClaude.xcodeproj" ]; then
          echo "has_xcodeproj=true" >> $GITHUB_OUTPUT
          echo "✅ Found Xcode project"
        else
          echo "has_xcodeproj=false" >> $GITHUB_OUTPUT
          echo "⚠️  Xcode project not found, skipping release build"
        fi

    - name: Build Release (Xcode)
      if: steps.check_project.outputs.has_xcodeproj == 'true'
      run: |
        cd LivesportClaude
        xcodebuild build \
          -project LivesportClaude.xcodeproj \
          -scheme LivesportClaude \
          -configuration Release \
          -destination 'platform=macOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Build Release (Swift Package)
      if: steps.check_project.outputs.has_xcodeproj == 'false'
      run: |
        swift build -c release

    - name: Archive build artifacts
      if: steps.check_project.outputs.has_xcodeproj == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: LivesportClaude/build/

  package:
    name: Create Distribution Packages
    runs-on: macos-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build Release Binary
      run: |
        swift build -c release
        echo "✅ Release binary built successfully"

    - name: Create .app Bundle
      run: |
        APP_NAME="LivesportClaude"
        APP_BUNDLE="dist/${APP_NAME}.app"

        # Create app bundle structure
        mkdir -p "${APP_BUNDLE}/Contents/MacOS"
        mkdir -p "${APP_BUNDLE}/Contents/Resources"

        # Copy binary
        cp .build/release/LivesportClaude "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"
        chmod +x "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"

        # Create Info.plist
        cat > "${APP_BUNDLE}/Contents/Info.plist" << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>LivesportClaude</string>
            <key>CFBundleIdentifier</key>
            <string>com.livesport.claude</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>LivesportClaude</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
            <key>NSHumanReadableCopyright</key>
            <string>Copyright © 2024 Livesport. All rights reserved.</string>
            <key>LSUIElement</key>
            <false/>
        </dict>
        </plist>
        EOF

        # Copy icon if exists
        if [ -f "LivesportClaude/LivesportClaude/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png" ]; then
          cp "LivesportClaude/LivesportClaude/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png" "${APP_BUNDLE}/Contents/Resources/AppIcon.icns"
        fi

        echo "✅ .app bundle created at ${APP_BUNDLE}"

    - name: Create DMG
      run: |
        APP_NAME="LivesportClaude"
        VERSION="1.0.0"
        DMG_NAME="${APP_NAME}-${VERSION}.dmg"

        # Create temporary DMG directory
        mkdir -p dist/dmg
        cp -R "dist/${APP_NAME}.app" dist/dmg/

        # Create symbolic link to Applications folder
        ln -s /Applications dist/dmg/Applications

        # Create DMG
        hdiutil create -volname "${APP_NAME}" \
          -srcfolder dist/dmg \
          -ov -format UDZO \
          "dist/${DMG_NAME}"

        echo "✅ DMG created: dist/${DMG_NAME}"
        ls -lh "dist/${DMG_NAME}"

    - name: Create PKG Installer
      run: |
        APP_NAME="LivesportClaude"
        VERSION="1.0.0"
        PKG_NAME="${APP_NAME}-${VERSION}.pkg"

        # Create package root
        mkdir -p dist/pkgroot/Applications
        cp -R "dist/${APP_NAME}.app" dist/pkgroot/Applications/

        # Build package
        pkgbuild --root dist/pkgroot \
          --identifier "com.livesport.claude" \
          --version "${VERSION}" \
          --install-location "/" \
          "dist/${PKG_NAME}"

        echo "✅ PKG created: dist/${PKG_NAME}"
        ls -lh "dist/${PKG_NAME}"

    - name: Generate checksums
      run: |
        cd dist
        shasum -a 256 *.dmg *.pkg > checksums.txt
        cat checksums.txt
        echo "✅ Checksums generated"

    - name: Upload .app Bundle
      uses: actions/upload-artifact@v4
      with:
        name: LivesportClaude-app
        path: dist/LivesportClaude.app

    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: LivesportClaude-dmg
        path: dist/*.dmg

    - name: Upload PKG
      uses: actions/upload-artifact@v4
      with:
        name: LivesportClaude-pkg
        path: dist/*.pkg

    - name: Upload Checksums
      uses: actions/upload-artifact@v4
      with:
        name: checksums
        path: dist/checksums.txt

    - name: Create Release Summary
      run: |
        echo "## 📦 Distribution Packages Created" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Files:" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        ls -lh dist/ >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Checksums:" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat dist/checksums.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  lint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: |
        cd LivesportClaude/LivesportClaude
        swiftlint lint --reporter github-actions-logging || true
